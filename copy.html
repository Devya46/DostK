<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Tax Consultancy CTA | Expert Advice</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .body-CTA {
        background: #ffffff; /* soft neutral fallback */
        /* min-height: 100vh; */
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui, "Segoe UI", "Inter", "Helvetica Neue", sans-serif;
        padding: 1.5rem;
      }

      /* CARD CONTAINER — light background + light background image (soft abstract) */
      .cta-card {
        max-width: 1100px;
        width: 100%;
        background: linear-gradient(115deg, #d8eaf9, white);
        border-radius: 2rem;
        box-shadow:
          0 20px 35px -12px rgba(0, 0, 0, 0.08),
          0 2px 6px rgba(0, 0, 0, 0.02);
        transition: all 0.25s ease;
        border: 1px solid rgba(255, 255, 245, 0.9);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(0px);
      }

      /* LIGHT COLOR BACKGROUND IMAGE (soft gradient + subtle geometric waves) */
      .cta-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZCIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3R5bGU9InN0b3AtY29sb3I6I2U4ZjBlODsgc3RvcC1vcGFjaXR5OjAuMjUiIC8+PHN0b3Agb2Zmc2V0PSI0NSUiIHN0eWxlPSJzdG9wLWNvbG9yOiNmZmZkZjA7IHN0b3Atb3BhY2l0eTowLjE1IiAvPjxzdG9wIG9mZnNldD0iMTAwJSIgc3R5bGU9InN0b3AtY29sb3I6I2RjZThlYzsgc3RvcC1vcGFjaXR5OjAuMDgiIC8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmFkKSIvPjxjaXJjbGUgY3g9IjEwJSIgY3k9IjkwJSIgcj0iMTUwIiBmaWxsPSIjZTJmMGUwIiBmaWxsLW9wYWNpdHk9IjAuMTUiLz48Y2lyY2xlIGN4PSI4NSUiIGN5PSIxMCUiIHI9IjE4MCIgZmlsbD0iI2ZmZjRlMCIgZmlsbC1vcGFjaXR5PSIwLjEiLz48cGF0aCBkPSJNMCAyNTAgTDEwMCAyMDBMMjAwIDI1MEwzMDAgMTUwTDQwMCAyMjBMNTAwIDE4MEw2MDAgMjQwTDcwMCAxNzBMODAwIDI1MEw5MDAgMjAwTDEwMDAgMjUwIiBzdHJva2U9IiM4MGEwODAiIHN0cm9rZS13aWR0aD0iMS41IiBmaWxsPSJub25lIiBvcGFjaXR5PSIwLjA4IiAvPjxwYXRoIGQ9Ik0wIDMwMCBMMTUwIDI1MEwyNTAgMzAwTDM1MCAyMjBMNDUwIDI4MEw1NTAgMjUwTDY1MCAzMDVMNzUwIDI0MEw4NTAgMzAwTDk1MCAyNzBMMTA1MCAzMTAiIHN0cm9rZT0iIzdjOTg3YSIgc3Ryb2tlLXdpZHRoPSIxLjIiIGZpbGw9Im5vbmUiIG9wYWNpdHk9IjAuMDYiLz48L3N2Zz4=");
        background-repeat: repeat;
        background-size: 280px auto;
        background-position: 0% 30%;
        opacity: 0.5;
        pointer-events: none;
        z-index: 0;
      }

      /* additional soft gradient overlay to keep readability and light tone */
      .cta-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 0% 20%,
          rgba(245, 250, 240, 0.2),
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      /* content layer above bg image */
      .cta-inner {
        position: relative;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 1.5rem 2rem;
      }

      /* text block */
      .cta-message {
        flex: 3;
        min-width: 240px;
      }

      /* icon-based tagline using SVG instead of emoji */
      .cta-tagline {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: rgba(46, 87, 62, 0.12);
        backdrop-filter: blur(2px);
        padding: 0.3rem 1rem 0.3rem 0.85rem;
        border-radius: 40px;
        margin-bottom: 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: #2b6e3c;
      }

      .tag-icon {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .cta-headline {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        color: #1a2c3e;
        margin: 24px 0;
      }

      .cta-description {
        font-size: 1rem;
        line-height: 1.45;
        color: #2d3e50;
        opacity: 0.85;
        max-width: 650px;
      }

      /* BUTTON group - icon via SVG */
      .cta-actions {
        flex-shrink: 0;
        display: flex;
        justify-content: flex-end;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        background: #0f7bb3;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        padding: 0.8rem 2rem;
        border-radius: 60px;
        text-decoration: none;
        transition: all 0.25s;
        border: none;
        cursor: pointer;
        box-shadow: 0 5px 14px rgba(15, 123, 179, 0.2);
        letter-spacing: -0.2px;
        white-space: nowrap;
        font-family: inherit;
      }

      .btn-primary:hover {
        background: #0074ae;
        transform: translateY(-2px);
        box-shadow: 0 12px 22px -8px rgba(15, 123, 179, 0.4);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      /* button icon wrapper (arrow + calendar hybrid concept: arrow-right + calendar representative) */
      .btn-icon-svg {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
      }

      .btn-primary:hover .btn-icon-svg {
        transform: translateX(3px);
      }

      /* Responsive: keep height minimal */
      @media (max-width: 780px) {
        .cta-inner {
          flex-direction: column;
          align-items: flex-start;
          padding: 1.4rem 1.5rem;
          gap: 1.2rem;
        }

        .cta-actions {
          width: 100%;
          justify-content: flex-start;
        }

        .btn-primary {
          white-space: normal;
          text-align: center;
          padding: 0.7rem 1.6rem;
          font-size: 0.95rem;
          width: auto;
          min-width: 260px;
        }

        .cta-headline {
          font-size: 1.4rem;
        }
      }

      @media (max-width: 480px) {
        .cta-inner {
          padding: 1.2rem 1.2rem;
        }
        .cta-headline {
          font-size: 1.25rem;
        }
        .cta-description {
          font-size: 0.9rem;
        }
        .btn-primary {
          padding: 0.65rem 1.4rem;
          font-size: 0.88rem;
          gap: 0.5rem;
        }
        .cta-tagline {
          font-size: 0.7rem;
          padding: 0.2rem 0.8rem 0.2rem 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <section class="body-CTA">
      <div class="cta-card">
        <div class="cta-inner">
          <!-- left message block with clean icons (no emojis) -->
          <div class="cta-message">

            <div class="cta-headline">

            </div>
            <div class="cta-description">
              Expert tax consultancy tailored to your needs — proactive,

          <!-- button block: redirects to contact.html + icon (calendar + arrow) -->
          <div class="cta-actions">
